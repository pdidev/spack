name: "spack-packages"
# Checks that the Python files of this repository pass the spack-packages style check: ruff, with
# the configuration and the version spack-packages uses, and no non-ASCII character in comments.
on:
  pull_request:
  push:
    branches: [ stable ]
jobs:
  style:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: pdi_spack
      - name: Checkout spack-packages
        uses: actions/checkout@v4
        with:
          repository: spack/spack-packages
          ref: develop
          path: spack-packages
      - name: Check the formatting
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version-file: spack-packages/.github/workflows/requirements/style/requirements.txt
          args: format --diff --config ${{ github.workspace }}/spack-packages/pyproject.toml
          src: pdi_spack
      - name: Lint
        if: ${{ !cancelled() }}
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version-file: spack-packages/.github/workflows/requirements/style/requirements.txt
          args: check --no-fix --config ${{ github.workspace }}/spack-packages/pyproject.toml
          src: pdi_spack
      - name: Check for non-ASCII characters in comments
        if: ${{ !cancelled() }}
        working-directory: pdi_spack
        run: |
          if git ls-files -z '*.py' '*.pyi' | xargs -0 env LC_ALL=C grep -Hn "$(printf '#.*[\200-\377]')"
          then echo "::error::non-ASCII characters in comments, which spack-packages refuses"; exit 1
          fi
